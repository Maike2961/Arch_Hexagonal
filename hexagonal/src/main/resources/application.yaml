server:
  port: ${APP_PORT:8085}

spring:
  application:
    name: hexagonal
  mongodb:
    host: ${MONGO_DB_HOST:localhost}
    port: ${MONGO_DB_PORT:27017}
    database: ${MONGO_DB_NAME:hexagonal}
    username: ${MONGO_DB_USER:root}
    password: ${MONGO_DB_PASSWORD:example}
    authentication-database: admin
  data:
    web:
      pageable:
        one-indexed-parameters: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      group-id: ${KAFKA_GROUP_ID:arantes}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  cep:
    api:
      url: ${API_CEP:https://viacep.com.br/ws}

logging:
  level:
    root: ${LOG_LEVEL:INFO}

---
# Docker Profile - All services in containers
spring:
  config:
    activate:
      on-profile: docker
  mongodb:
    uri: mongodb://${MONGO_DB_USER:root}:${MONGO_DB_PASSWORD:example}@mongo:27017/${MONGO_DB_NAME:hexagonal}?authSource=admin
  kafka:
    bootstrap-servers: kafka:29092