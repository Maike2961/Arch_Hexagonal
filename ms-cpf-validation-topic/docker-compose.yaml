services:
  ms-cpf-validation-topic:
    container_name: ms-cpf-validation-topic
    image: maykiabromowatch/ms-cpf-validation-topic:v1.0.0
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      APP_PORT: 8082
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
        - "8082:8082"
    networks:
        - microservices
networks:
  microservices:
    external: true
    name: microservices